<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070720"/><stop offset="55%" stop-color="#141a4e"/><stop offset="100%" stop-color="#04040f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8a2ad0" stop-opacity="0.5"/><stop offset="100%" stop-color="#8a2ad0" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2a8fd6" stop-opacity="0.45"/><stop offset="100%" stop-color="#2a8fd6" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d03a9a" stop-opacity="0.35"/><stop offset="100%" stop-color="#d03a9a" stop-opacity="0"/></radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fbff"/><stop offset="45%" stop-color="#a9d4ef"/><stop offset="100%" stop-color="#3a6a9a"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="30%" r="76%"><stop offset="0%" stop-color="#9fd0ff"/><stop offset="48%" stop-color="#4a6ad0"/><stop offset="100%" stop-color="#1a1f5a"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cfe6ff"/><stop offset="50%" stop-color="#ffd6f0"/><stop offset="100%" stop-color="#6a7ac0"/></linearGradient>
    <radialGradient id="nova" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#9fe6ff"/><stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="tailc" gradientUnits="userSpaceOnUse" x1="820" y1="150" x2="640" y2="60"><stop offset="0%" stop-color="#cff6ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/></linearGradient>
    <filter id="tglow" x="-20%" y="-70%" width="140%" height="240%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6ad0ff" flood-opacity="0.95"/></filter>
    <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8ad0ff" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <ellipse cx="300" cy="360" rx="360" ry="240" fill="url(#neb1)"/>
  <ellipse cx="700" cy="220" rx="340" ry="220" fill="url(#neb2)"/>
  <ellipse cx="520" cy="320" rx="300" ry="180" fill="url(#neb3)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="2"/><circle cx="180" cy="140" r="1.4"/><circle cx="260" cy="60" r="1.8"/>
    <circle cx="360" cy="120" r="1.3"/><circle cx="520" cy="80" r="1.6"/><circle cx="620" cy="150" r="1.4"/>
    <circle cx="720" cy="70" r="1.8"/><circle cx="860" cy="120" r="1.5"/><circle cx="120" cy="230" r="1.4"/>
    <circle cx="300" cy="440" r="1.6"/><circle cx="820" cy="420" r="1.6"/><circle cx="900" cy="300" r="1.4"/>
    <circle cx="60" cy="360" r="1.5"/><circle cx="440" cy="470" r="1.4"/>
    <path d="M150 90 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.9"/>
    <path d="M780 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.8"/>
  </g>

  <!-- ringed planet (left) -->
  <g transform="translate(180,360)">
    <path d="M-120 0 A120 34 0 0 1 120 0" transform="rotate(-18)" fill="none" stroke="url(#ring)" stroke-width="13" opacity="0.9"/>
    <g filter="url(#pglow)"><circle cx="0" cy="0" r="78" fill="url(#planet)" stroke="#141a4e" stroke-width="3"/></g>
    <ellipse cx="0" cy="-22" rx="62" ry="12" fill="#6a8ae0" opacity="0.4"/>
    <ellipse cx="0" cy="18" rx="66" ry="13" fill="#2a2f7a" opacity="0.4"/>
    <ellipse cx="-26" cy="-26" rx="20" ry="12" fill="#ffffff" opacity="0.3"/>
    <path d="M-120 0 A120 34 0 0 0 120 0" transform="rotate(-18)" fill="none" stroke="url(#ring)" stroke-width="13"/>
  </g>

  <!-- comet (upper right) -->
  <path d="M812 156 L788 182 L648 58 L672 46 Z" fill="url(#tailc)"/>
  <g filter="url(#pglow)"><circle cx="804" cy="164" r="20" fill="#ffffff"/></g>

  <!-- central nova -->
  <g transform="translate(560,300)">
    <circle r="150" fill="url(#nova)"/>
    <g fill="url(#nova)" opacity="0.7">
      <polygon points="-10,-170 10,-170 5,0 -5,0"/>
      <polygon points="-10,-170 10,-170 5,0 -5,0" transform="rotate(90)"/>
      <polygon points="-10,-170 10,-170 5,0 -5,0" transform="rotate(45)"/>
      <polygon points="-10,-170 10,-170 5,0 -5,0" transform="rotate(135)"/>
    </g>
    <circle r="30" fill="#ffffff"/>
  </g>

  <!-- title cartouche -->
  <rect x="250" y="52" width="460" height="80" rx="40" fill="#0a0f30" fill-opacity="0.6" stroke="url(#chrome)" stroke-width="4"/>
  <circle cx="250" cy="92" r="9" fill="url(#chrome)"/><circle cx="710" cy="92" r="9" fill="url(#chrome)"/>
  <text x="480" y="107" font-family="DejaVu Serif, Georgia, serif" font-size="48" font-weight="bold"
        letter-spacing="5" text-anchor="middle" fill="url(#chrome)" stroke="#1a3a5a" stroke-width="1.6" filter="url(#tglow)">NOVA CÓSMICA</text>

  <!-- frame -->
  <rect x="10" y="10" width="940" height="520" rx="18" fill="none" stroke="url(#chrome)" stroke-width="4" opacity="0.9"/>
  <rect x="18" y="18" width="924" height="504" rx="14" fill="none" stroke="#d8ecff" stroke-width="1.5" opacity="0.4"/>
  <g fill="url(#chrome)"><circle cx="10" cy="10" r="7"/><circle cx="950" cy="10" r="7"/><circle cx="10" cy="530" r="7"/><circle cx="950" cy="530" r="7"/></g>
</svg>
