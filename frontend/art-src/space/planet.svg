<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#2b3a86"/><stop offset="60%" stop-color="#121a4a"/><stop offset="100%" stop-color="#05040f"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/><stop offset="35%" stop-color="#a9d4ef"/><stop offset="62%" stop-color="#5f8fc0"/><stop offset="100%" stop-color="#26456e"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#ffd6a0"/><stop offset="48%" stop-color="#e58a46"/><stop offset="100%" stop-color="#7a2f28"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe6ff"/><stop offset="50%" stop-color="#ffe3b0"/><stop offset="100%" stop-color="#9c7a4a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ffd6a0" stop-opacity="0.45"/><stop offset="55%" stop-color="#e58a46" stop-opacity="0.13"/><stop offset="100%" stop-color="#e58a46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffb0f0"/><stop offset="55%" stop-color="#d03aa0"/><stop offset="100%" stop-color="#601560"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.6" flood-color="#8ad0ff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="48" fill="url(#bg)" stroke="url(#chrome)" stroke-width="8"/>
  <g fill="#ffffff">
    <circle cx="52" cy="60" r="2"/><circle cx="196" cy="64" r="1.6"/><circle cx="72" cy="182" r="1.8"/>
    <circle cx="204" cy="176" r="1.5"/><circle cx="150" cy="48" r="1.5"/><circle cx="46" cy="120" r="1.4"/>
  </g>
  <rect x="26" y="26" width="204" height="204" rx="40" fill="none" stroke="url(#chrome)" stroke-width="3.5"/>
  <rect x="33" y="33" width="190" height="190" rx="34" fill="none" stroke="#d8ecff" stroke-width="1.4" opacity="0.4"/>
  <rect x="34" y="30" width="188" height="80" rx="30" fill="url(#spec)"/>
  <ellipse cx="128" cy="140" rx="94" ry="88" fill="url(#halo)"/>

  <!-- ring (back), planet, ring (front) -->
  <g transform="rotate(-20 128 138)">
    <path d="M40 138 A88 24 0 0 1 216 138" fill="none" stroke="url(#ring)" stroke-width="11" opacity="0.9"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="128" cy="138" r="56" fill="url(#planet)" stroke="#5a241e" stroke-width="3"/>
  </g>
  <ellipse cx="128" cy="120" rx="46" ry="9" fill="#a85a34" opacity="0.5"/>
  <ellipse cx="128" cy="150" rx="50" ry="10" fill="#7a3524" opacity="0.45"/>
  <ellipse cx="110" cy="118" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>
  <g transform="rotate(-20 128 138)">
    <path d="M40 138 A88 24 0 0 0 216 138" fill="none" stroke="url(#ring)" stroke-width="11"/>
  </g>

  <g stroke="url(#chrome)" stroke-width="2">
    <circle cx="128" cy="30" r="8" fill="url(#gem)"/>
    <circle cx="40" cy="128" r="6" fill="url(#gem)"/>
    <circle cx="216" cy="128" r="6" fill="url(#gem)"/>
  </g>
</svg>
