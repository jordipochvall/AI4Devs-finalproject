<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140b3f"/>
      <stop offset="34%" stop-color="#452a86"/>
      <stop offset="60%" stop-color="#c74d86"/>
      <stop offset="80%" stop-color="#f4894a"/>
      <stop offset="100%" stop-color="#ffd36a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="45%" stop-color="#ffdc78"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="48%" stop-color="#f4d35e"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </linearGradient>
    <radialGradient id="coin" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="55%" stop-color="#f1c545"/>
      <stop offset="100%" stop-color="#9c6d16"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99b58"/>
      <stop offset="45%" stop-color="#e7c07a"/>
      <stop offset="100%" stop-color="#a9762f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d4a22"/>
      <stop offset="100%" stop-color="#4a2a12"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eebf7e"/>
      <stop offset="100%" stop-color="#9c6a1c"/>
    </linearGradient>
    <linearGradient id="nile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fe0e8"/>
      <stop offset="100%" stop-color="#2b6e9c"/>
    </linearGradient>
    <radialGradient id="chestglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="tglow" x="-20%" y="-70%" width="140%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffdf7e" flood-opacity="0.95"/>
    </filter>
    <filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffe9a0" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff4d6">
    <circle cx="120" cy="58" r="2.2"/><circle cx="250" cy="104" r="1.5"/><circle cx="340" cy="52" r="1.9"/>
    <circle cx="630" cy="66" r="1.7"/><circle cx="740" cy="110" r="2"/><circle cx="855" cy="56" r="1.6"/>
    <path d="M185 78 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.9"/>
    <path d="M800 92 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z" opacity="0.85"/>
  </g>

  <!-- sun -->
  <g transform="translate(480,250)" opacity="0.55" fill="url(#sun)">
    <polygon points="-14,-230 14,-230 6,0 -6,0"/>
    <polygon points="170,-170 190,-150 8,4 -4,-8" opacity="0.7"/>
    <polygon points="-170,-170 -190,-150 -8,4 4,-8" opacity="0.7"/>
    <polygon points="240,-30 240,-8 6,4 6,-8" opacity="0.5"/>
    <polygon points="-240,-30 -240,-8 -6,4 -6,-8" opacity="0.5"/>
  </g>
  <circle cx="480" cy="250" r="150" fill="url(#sun)"/>
  <circle cx="480" cy="250" r="74" fill="#ffe58a"/>

  <!-- pyramids -->
  <polygon points="470,344 600,120 730,344" fill="#8a5e2c"/>
  <polygon points="600,120 730,344 600,344" fill="#653f1c"/>
  <polygon points="600,120 470,344 600,344" fill="#9a6c33"/>
  <polygon points="235,344 345,176 455,344" fill="#7c5326"/>
  <polygon points="345,176 455,344 345,344" fill="#5a3717"/>
  <g stroke="url(#gold)" stroke-width="2.5" opacity="0.7" fill="none">
    <path d="M600 120 L730 344"/><path d="M345 176 L455 344"/>
  </g>

  <!-- Nile band + reflection -->
  <rect x="0" y="338" width="960" height="26" fill="url(#nile)"/>
  <g fill="#eafcff" opacity="0.5">
    <rect x="120" y="346" width="120" height="3" rx="1.5"/>
    <rect x="600" y="350" width="160" height="3" rx="1.5"/>
    <rect x="300" y="356" width="90" height="3" rx="1.5"/>
  </g>

  <!-- temple columns -->
  <g>
    <rect x="40" y="150" width="66" height="290" fill="url(#stone)" stroke="#7c5320" stroke-width="2"/>
    <path d="M30 150 Q73 118 116 150 L116 168 L30 168 Z" fill="url(#gold)"/>
    <rect x="34" y="440" width="78" height="18" rx="4" fill="url(#gold)"/>
    <g fill="#7c5320" opacity="0.85">
      <rect x="56" y="196" width="34" height="24"/><rect x="56" y="236" width="34" height="24"/>
      <rect x="56" y="276" width="34" height="24"/><rect x="56" y="316" width="34" height="24"/>
    </g>
    <rect x="854" y="150" width="66" height="290" fill="url(#stone)" stroke="#7c5320" stroke-width="2"/>
    <path d="M844 150 Q887 118 930 150 L930 168 L844 168 Z" fill="url(#gold)"/>
    <rect x="848" y="440" width="78" height="18" rx="4" fill="url(#gold)"/>
    <g fill="#7c5320" opacity="0.85">
      <rect x="870" y="196" width="34" height="24"/><rect x="870" y="236" width="34" height="24"/>
      <rect x="870" y="276" width="34" height="24"/><rect x="870" y="316" width="34" height="24"/>
    </g>
  </g>

  <!-- dunes -->
  <path d="M0 360 Q240 338 480 360 T960 360 L960 540 L0 540 Z" fill="url(#sand)"/>
  <path d="M0 430 Q300 404 620 430 T960 420 L960 540 L0 540 Z" fill="#d4a563" opacity="0.6"/>

  <!-- ===== TREASURE (hero, foreground) ===== -->
  <ellipse cx="480" cy="452" rx="230" ry="90" fill="url(#chestglow)"/>

  <!-- scattered coins/gems around -->
  <g stroke="#8a5f16" stroke-width="1.5">
    <ellipse cx="250" cy="470" rx="20" ry="9" fill="url(#coin)"/>
    <ellipse cx="300" cy="488" rx="22" ry="10" fill="url(#coin)"/>
    <ellipse cx="690" cy="474" rx="20" ry="9" fill="url(#coin)"/>
    <ellipse cx="655" cy="492" rx="22" ry="10" fill="url(#coin)"/>
  </g>
  <polygon points="215,452 228,462 223,478 207,478 202,462" fill="#e0405f" stroke="#7a1526" stroke-width="1.5"/>
  <polygon points="735,456 748,466 743,482 727,482 722,466" fill="#2fa7d8" stroke="#124a66" stroke-width="1.5"/>

  <!-- chest -->
  <g filter="url(#cglow)">
    <path d="M384 402 Q384 356 430 348 L530 348 Q576 356 576 402 Z" fill="url(#wood)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M392 402 Q392 366 430 360 L530 360 Q568 366 568 402 Z" fill="url(#coin)" opacity="0.9"/>
    <rect x="378" y="398" width="204" height="86" rx="8" fill="url(#wood)" stroke="url(#gold)" stroke-width="4"/>
    <rect x="378" y="420" width="204" height="12" fill="url(#gold)"/>
    <rect x="470" y="398" width="20" height="86" fill="url(#gold)"/>
    <rect x="466" y="430" width="28" height="24" rx="4" fill="#8a5f16" stroke="url(#gold)" stroke-width="2"/>
  </g>

  <!-- coins spilling over the front -->
  <g stroke="#8a5f16" stroke-width="1.5">
    <ellipse cx="420" cy="470" rx="22" ry="11" fill="url(#coin)"/>
    <ellipse cx="470" cy="482" rx="24" ry="12" fill="url(#coin)"/>
    <ellipse cx="524" cy="470" rx="22" ry="11" fill="url(#coin)"/>
    <ellipse cx="446" cy="494" rx="22" ry="11" fill="url(#coin)"/>
    <ellipse cx="500" cy="496" rx="22" ry="11" fill="url(#coin)"/>
    <ellipse cx="480" cy="392" rx="18" ry="9" fill="url(#coin)"/>
    <ellipse cx="452" cy="386" rx="15" ry="8" fill="url(#coin)"/>
    <ellipse cx="512" cy="388" rx="15" ry="8" fill="url(#coin)"/>
  </g>
  <g fill="#fff3b0" opacity="0.8">
    <ellipse cx="414" cy="466" rx="7" ry="3"/><ellipse cx="494" cy="492" rx="7" ry="3"/>
  </g>

  <!-- sparkles over treasure -->
  <g fill="#fff6d8">
    <path d="M360 380 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M600 372 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.9"/>
    <path d="M540 430 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
  </g>

  <!-- title cartouche -->
  <rect x="232" y="54" width="496" height="80" rx="40" fill="#1a1140" fill-opacity="0.6" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="232" cy="94" r="9" fill="url(#gold)"/>
  <circle cx="728" cy="94" r="9" fill="url(#gold)"/>
  <text x="480" y="108" font-family="DejaVu Serif, Georgia, serif" font-size="46" font-weight="bold"
        letter-spacing="4" text-anchor="middle" fill="url(#gold)" stroke="#5a3d10" stroke-width="1.6"
        filter="url(#tglow)">TESORO DEL NILO</text>

  <!-- ornate frame -->
  <rect x="10" y="10" width="940" height="520" rx="18" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>
  <rect x="18" y="18" width="924" height="504" rx="14" fill="none" stroke="#ffe9a8" stroke-width="1.5" opacity="0.45"/>
  <g fill="url(#gold)">
    <circle cx="10" cy="10" r="7"/><circle cx="950" cy="10" r="7"/>
    <circle cx="10" cy="530" r="7"/><circle cx="950" cy="530" r="7"/>
  </g>
</svg>
