    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(60 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(90 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(120 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(150 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(180 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(210 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(240 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(270 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(300 128 128)"/>
