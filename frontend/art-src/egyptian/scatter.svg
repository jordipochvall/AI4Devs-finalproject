  <rect x="26" y="26" width="204" height="204" rx="40" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <rect x="33" y="33" width="190" height="190" rx="34" fill="none" stroke="#ffe9a8" stroke-width="1.4" opacity="0.4"/>
  <rect x="34" y="30" width="188" height="80" rx="30" fill="url(#spec)"/>
  <ellipse cx="128" cy="120" rx="92" ry="94" fill="url(#halo)"/>

