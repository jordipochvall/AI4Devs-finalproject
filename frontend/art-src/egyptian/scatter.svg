    <path d="M196 86 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
  </g>

  <!-- ankh bevel copy -->
  <g transform="translate(0,3)" opacity="0.5" fill="#4a3208">
    <rect x="118" y="104" width="20" height="98" rx="10"/>
    <rect x="90" y="122" width="76" height="20" rx="10"/>
  </g>
