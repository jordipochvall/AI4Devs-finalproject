<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#6a49c8"/>
      <stop offset="62%" stop-color="#2e1c66"/>
      <stop offset="100%" stop-color="#100826"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="28%" stop-color="#f7dc73"/>
      <stop offset="55%" stop-color="#e2ad33"/>
      <stop offset="100%" stop-color="#8a5f16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffcf5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffcf5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
