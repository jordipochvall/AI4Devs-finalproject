<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#2f6ccc"/>
      <stop offset="62%" stop-color="#123163"/>
      <stop offset="100%" stop-color="#050c1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="28%" stop-color="#f7dc73"/>
      <stop offset="55%" stop-color="#e2ad33"/>
      <stop offset="100%" stop-color="#8a5f16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ffcf5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffcf5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7fd0ff"/>
      <stop offset="55%" stop-color="#2b6fd6"/>
      <stop offset="100%" stop-color="#0d2b66"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.6" flood-color="#ffe08a" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>

  <!-- sunburst rays -->
  <g opacity="0.12" fill="url(#gold)">
    <path d="M124 128 L128 6 L132 128 Z"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(30 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(60 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(90 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(120 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(150 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(180 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(210 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(240 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(270 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(300 128 128)"/>
    <path d="M124 128 L128 6 L132 128 Z" transform="rotate(330 128 128)"/>
  </g>

  <!-- ornate inner frame -->
  <rect x="26" y="26" width="204" height="204" rx="40" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <rect x="33" y="33" width="190" height="190" rx="34" fill="none" stroke="#ffe9a8" stroke-width="1.4" opacity="0.4"/>
  <rect x="34" y="30" width="188" height="80" rx="30" fill="url(#spec)"/>
  <ellipse cx="128" cy="118" rx="96" ry="92" fill="url(#halo)"/>

  <!-- Eye of Horus (bevel: dark copy behind + gold) -->
  <g transform="translate(0,3)" opacity="0.55" fill="none" stroke="#4a3208" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 96 Q118 62 196 92" stroke-width="15"/>
    <path d="M56 128 Q118 96 186 126 Q120 158 56 128 Z" fill="#4a3208" stroke-width="6"/>
    <path d="M112 152 L96 202" stroke-width="14"/>
    <path d="M176 132 Q206 150 198 186 Q194 206 214 208" stroke-width="14"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 96 Q118 62 196 92" stroke-width="15"/>
    <path d="M56 128 Q118 96 186 126 Q120 158 56 128 Z" fill="url(#gold)" stroke-width="6"/>
    <path d="M112 152 L96 202" stroke-width="14"/>
    <path d="M176 132 Q206 150 198 186 Q194 206 214 208" stroke-width="14"/>
  </g>
  <path d="M64 92 Q118 66 188 90" stroke="#fff6d8" stroke-width="3" opacity="0.7" fill="none" stroke-linecap="round"/>
  <circle cx="118" cy="127" r="15" fill="#050c1c"/>
  <ellipse cx="112" cy="121" rx="5" ry="4" fill="#ffffff" opacity="0.9"/>

  <!-- corner gems + top gem -->
  <g stroke="url(#gold)" stroke-width="2">
    <circle cx="128" cy="30" r="8" fill="url(#gem)"/>
    <circle cx="40" cy="128" r="6" fill="url(#gem)"/>
    <circle cx="216" cy="128" r="6" fill="url(#gem)"/>
  </g>

  <!-- WILD nameplate -->
  <rect x="46" y="196" width="164" height="34" rx="12" fill="url(#gold)" stroke="#6d4a12" stroke-width="2" filter="url(#glow)"/>
  <rect x="52" y="200" width="152" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
  <text x="128" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold"
        letter-spacing="4" text-anchor="middle" fill="#3a260a">WILD</text>
</svg>
