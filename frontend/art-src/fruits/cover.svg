<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0f52"/>
      <stop offset="45%" stop-color="#a3216f"/>
      <stop offset="100%" stop-color="#f47a3a"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff3c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff3c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6d8"/><stop offset="50%" stop-color="#f4d35e"/><stop offset="100%" stop-color="#b8862a"/>
    </linearGradient>
    <radialGradient id="cherry" cx="38%" cy="30%" r="72%"><stop offset="0%" stop-color="#ff8a97"/><stop offset="52%" stop-color="#e21f3a"/><stop offset="100%" stop-color="#8a0f20"/></radialGradient>
    <radialGradient id="lemon" cx="38%" cy="30%" r="74%"><stop offset="0%" stop-color="#fff6a0"/><stop offset="52%" stop-color="#f4cb1e"/><stop offset="100%" stop-color="#b8850f"/></radialGradient>
    <radialGradient id="orange" cx="38%" cy="30%" r="74%"><stop offset="0%" stop-color="#ffcf7a"/><stop offset="50%" stop-color="#ff8a1e"/><stop offset="100%" stop-color="#c25508"/></radialGradient>
    <radialGradient id="plum" cx="38%" cy="30%" r="74%"><stop offset="0%" stop-color="#c9a0ff"/><stop offset="50%" stop-color="#8a3ad0"/><stop offset="100%" stop-color="#3f1470"/></radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff8a97"/><stop offset="45%" stop-color="#ec2340"/><stop offset="100%" stop-color="#8a0f20"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8be35a"/><stop offset="100%" stop-color="#2f9e2f"/></linearGradient>
    <filter id="tglow" x="-20%" y="-70%" width="140%" height="240%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffdf7e" flood-opacity="0.95"/></filter>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <ellipse cx="480" cy="300" rx="420" ry="260" fill="url(#spot)"/>

  <!-- sunburst -->
  <g transform="translate(480,300)" opacity="0.12" fill="#fff3c0">
    <polygon points="-22,-320 22,-320 8,0 -8,0"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(40)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(80)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(120)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(160)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(200)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(240)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(280)"/>
    <polygon points="-22,-320 22,-320 8,0 -8,0" transform="rotate(320)"/>
  </g>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="120" y="90" width="16" height="10" rx="2" fill="#ffd84a" transform="rotate(20 128 95)"/>
    <rect x="760" y="120" width="16" height="10" rx="2" fill="#4fd0ff" transform="rotate(-25 768 125)"/>
    <rect x="220" y="180" width="14" height="9" rx="2" fill="#7ef05a" transform="rotate(40 227 184)"/>
    <rect x="700" y="220" width="14" height="9" rx="2" fill="#ff6a8a" transform="rotate(-15 707 224)"/>
    <circle cx="160" cy="260" r="7" fill="#ff8a1e"/>
    <circle cx="820" cy="300" r="7" fill="#b06aff"/>
    <circle cx="300" cy="110" r="6" fill="#4fd0ff"/>
    <circle cx="640" cy="90" r="6" fill="#7ef05a"/>
  </g>

  <!-- fruit cluster (hero) -->
  <g filter="url(#fglow)">
    <!-- orange -->
    <circle cx="392" cy="360" r="70" fill="url(#orange)" stroke="#9a4a08" stroke-width="4"/>
    <!-- lemon -->
    <g transform="rotate(-14 268 392)"><ellipse cx="268" cy="392" rx="64" ry="46" fill="url(#lemon)" stroke="#9a6a10" stroke-width="4"/></g>
    <!-- plum -->
    <ellipse cx="600" cy="372" rx="58" ry="64" fill="url(#plum)" stroke="#2f0f5a" stroke-width="4"/>
    <!-- cherries -->
    <circle cx="486" cy="418" r="40" fill="url(#cherry)" stroke="#6a0f1e" stroke-width="4"/>
    <circle cx="546" cy="432" r="34" fill="url(#cherry)" stroke="#6a0f1e" stroke-width="4"/>
  </g>
  <path d="M486 380 Q500 336 520 316" stroke="#7a4a1e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M546 400 Q536 352 520 316" stroke="#7a4a1e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M520 316 Q556 296 592 312 Q558 328 520 322 Z" fill="url(#leaf)" stroke="#256b1e" stroke-width="2"/>
  <ellipse cx="372" cy="336" rx="20" ry="12" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="476" cy="404" rx="12" ry="8" fill="#ffffff" opacity="0.5"/>

  <!-- lucky 7 accent -->
  <text x="690" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="150" font-weight="bold"
        text-anchor="middle" fill="url(#red)" stroke="url(#gold)" stroke-width="4" filter="url(#fglow)">7</text>

  <!-- sparkles -->
  <g fill="#fff6d8">
    <path d="M330 300 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M636 300 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.9"/>
    <path d="M470 300 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"/>
  </g>

  <!-- title cartouche -->
  <rect x="270" y="52" width="420" height="80" rx="40" fill="#2a0d33" fill-opacity="0.55" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="270" cy="92" r="9" fill="url(#gold)"/><circle cx="690" cy="92" r="9" fill="url(#gold)"/>
  <text x="480" y="107" font-family="DejaVu Serif, Georgia, serif" font-size="50" font-weight="bold"
        letter-spacing="4" text-anchor="middle" fill="url(#gold)" stroke="#5a3d10" stroke-width="1.6" filter="url(#tglow)">FRUTI FIESTA</text>

  <!-- frame -->
  <rect x="10" y="10" width="940" height="520" rx="18" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>
  <rect x="18" y="18" width="924" height="504" rx="14" fill="none" stroke="#ffe9a8" stroke-width="1.5" opacity="0.45"/>
  <g fill="url(#gold)"><circle cx="10" cy="10" r="7"/><circle cx="950" cy="10" r="7"/><circle cx="10" cy="530" r="7"/><circle cx="950" cy="530" r="7"/></g>
</svg>
