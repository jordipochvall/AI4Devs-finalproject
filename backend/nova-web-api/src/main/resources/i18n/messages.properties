# --- Errores genéricos ---
error.badRequest.title=Solicitud incorrecta
error.badRequest.detail=La solicitud contiene datos mal formados o inválidos.
error.unauthorized.title=No autenticado
error.unauthorized.detail=Se requiere autenticación para acceder a este recurso.
error.forbidden.title=Acceso denegado
error.forbidden.detail=No tienes permiso para realizar esta acción.
error.notFound.title=No encontrado
error.notFound.detail=El recurso solicitado no existe.
error.conflict.title=Conflicto
error.internalError.title=Error interno del servidor
error.internalError.detail=Se ha producido un error inesperado. Por favor, inténtalo de nuevo más tarde.
error.rateLimitExceeded.title=Demasiadas solicitudes
error.rateLimitExceeded.detail=Has superado el límite de peticiones. Espera un momento antes de reintentar.
error.serviceUnavailable.title=Servicio no disponible
error.serviceUnavailable.detail=El servicio externo no está disponible en este momento.

# --- Validación (422) ---
error.validation.title=Error de validación
error.validation.detail=Uno o más campos no superaron la validación.

# --- Autenticación / registro (401, 409, 422) ---
error.auth.invalidCredentials.detail=Credenciales incorrectas.
error.auth.emailAlreadyRegistered.detail=Este correo electrónico ya está registrado.
error.auth.ageVerificationFailed.detail=Debes tener al menos 18 años para registrarte.
error.auth.tokenExpired.detail=El token de acceso ha expirado. Por favor, vuelve a autenticarte.
error.auth.invalidRefresh.detail=La sesión no se puede renovar: el token de actualización no es válido o ha caducado.
error.auth.operatorInactive.detail=Tu cuenta o tu operador están desactivados. Contacta con la administración.

# --- Juego / spin (422) ---
error.spin.invalidBet.detail=La apuesta no es válida: debe estar en el rango permitido, respetar el incremento y ser múltiplo del número de líneas activas.
error.spin.betOutOfRange.detail=La apuesta debe estar entre {0} y {1} céntimos.
error.spin.insufficientBalance.detail=Saldo insuficiente. Necesario: {0} céntimos, disponible: {1} céntimos.
error.spin.betNotMultipleOfLines.detail=La apuesta debe ser múltiplo del número de líneas activas ({0}).
error.spin.gameNotActive.detail=Este juego no está disponible en este momento.

# --- Recarga (422) ---
error.recharge.invalidAmount.detail=El importe de la recarga debe ser positivo.

# --- Configuración comercial del operador (422) ---
error.operator.commercialConfigInvalid.detail=La configuración comercial no es coherente: la apuesta máxima debe ser ≥ la mínima, y la apuesta mínima y el paso deben ser múltiplos del número de líneas activas.

# --- Informe regulatorio RFJ (422) ---
error.report.integrityBroken.detail=No se puede generar el informe: la integridad del periodo está comprometida.

# --- Administración multi-operador (409) ---
error.admin.operatorCodeExists.detail=Ya existe un operador con ese código.

# --- Juego responsable (422, 403) ---
error.responsibleGaming.limitReached.detail=Has alcanzado tu límite de juego responsable. No puedes seguir jugando en este periodo.
error.responsibleGaming.selfExcluded.detail=Estás en un periodo de autoexclusión. El acceso al juego está bloqueado.

# --- Idempotencia (409) ---
error.idempotency.conflict.detail=Esta clave de idempotencia ya se usó con un payload diferente.
error.idempotency.concurrentModification.detail=Se ha detectado una modificación concurrente. Por favor, reintenta la operación.

# --- Simulación (422) ---
error.simulation.spinsOutOfRange.detail=El número de giros debe estar entre 1 y 10.000.000.
error.simulation.configNotFound.detail=La configuración matemática especificada no existe.

# --- IA explainability (422, 503) ---
error.explain.notCompleted.detail=La simulación debe estar completada para poder explicarla.
error.explain.unavailable.detail=La explicación con IA no está disponible (falta la clave de API).

# --- Editor de matemática (422) ---
error.config.invalid.detail=La configuración matemática contiene errores de validación.
error.config.symbolNotFound.detail=El símbolo ''{0}'' no está definido en el catálogo del juego.
error.config.paymentGap.detail=La tabla de pagos contiene un hueco para el símbolo ''{0}'' en el recuento {1}.

# --- Publicación de matemática (409) ---
error.math.configAlreadyActive.detail=Esta versión de matemática ya es la activa del juego.
