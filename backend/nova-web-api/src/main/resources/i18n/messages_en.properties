# --- Generic errors ---
error.badRequest.title=Bad Request
error.badRequest.detail=The request contains malformed or invalid data.
error.unauthorized.title=Unauthorized
error.unauthorized.detail=Authentication is required to access this resource.
error.forbidden.title=Forbidden
error.forbidden.detail=You do not have permission to perform this action.
error.notFound.title=Not Found
error.notFound.detail=The requested resource was not found.
error.conflict.title=Conflict
error.internalError.title=Internal Server Error
error.internalError.detail=An unexpected error occurred. Please try again later.
error.rateLimitExceeded.title=Too Many Requests
error.rateLimitExceeded.detail=You have exceeded the request rate limit. Please wait before retrying.
error.serviceUnavailable.title=Service Unavailable
error.serviceUnavailable.detail=The external service is currently unavailable.

# --- Validation (422) ---
error.validation.title=Validation Error
error.validation.detail=One or more fields failed validation.

# --- Authentication / registration (401, 409, 422) ---
error.auth.invalidCredentials.detail=Invalid credentials.
error.auth.emailAlreadyRegistered.detail=This email address is already registered.
error.auth.ageVerificationFailed.detail=You must be at least 18 years old to register.
error.auth.tokenExpired.detail=The access token has expired. Please authenticate again.
error.auth.invalidRefresh.detail=The session cannot be renewed: the refresh token is invalid or has expired.
error.auth.operatorInactive.detail=Your account or operator is deactivated. Please contact the administrator.

# --- Game / spin (422) ---
error.spin.invalidBet.detail=Invalid bet: it must be within the allowed range, respect the step and be a multiple of the number of active paylines.
error.spin.betOutOfRange.detail=Bet amount must be between {0} and {1} cents.
error.spin.insufficientBalance.detail=Insufficient balance. Required: {0} cents, available: {1} cents.
error.spin.betNotMultipleOfLines.detail=Bet amount must be a multiple of the number of active paylines ({0}).
error.spin.gameNotActive.detail=This game is not currently available.

# --- Recharge (422) ---
error.recharge.invalidAmount.detail=The recharge amount must be positive.

# --- Operator commercial configuration (422) ---
error.operator.commercialConfigInvalid.detail=The commercial configuration is inconsistent: the maximum bet must be >= the minimum, and the minimum bet and step must be multiples of the active payline count.

# --- RFJ regulatory report (422) ---
error.report.integrityBroken.detail=The report cannot be generated: the period's integrity is compromised.

# --- Multi-operator administration (409) ---
error.admin.operatorCodeExists.detail=An operator with that code already exists.

# --- Responsible gaming (422, 403) ---
error.responsibleGaming.limitReached.detail=You have reached your responsible-gaming limit. You cannot keep playing in this period.
error.responsibleGaming.selfExcluded.detail=You are within a self-exclusion period. Access to play is blocked.

# --- Idempotency (409) ---
error.idempotency.conflict.detail=This idempotency key was already used with a different payload.
error.idempotency.concurrentModification.detail=A concurrent modification was detected. Please retry the operation.

# --- Simulation (422) ---
error.simulation.spinsOutOfRange.detail=Number of spins must be between 1 and 10,000,000.
error.simulation.configNotFound.detail=The specified math configuration does not exist.

# --- AI explainability (422, 503) ---
error.explain.notCompleted.detail=The simulation must be completed before it can be explained.
error.explain.unavailable.detail=AI explanation is not available (missing API key).

# --- Math editor (422) ---
error.config.invalid.detail=The game configuration contains validation errors.
error.config.symbolNotFound.detail=Symbol ''{0}'' is not defined in the game catalog.
error.config.paymentGap.detail=The paytable has a gap for symbol ''{0}'' at count {1}.

# --- Math publication (409) ---
error.math.configAlreadyActive.detail=This math version is already the game's active one.
