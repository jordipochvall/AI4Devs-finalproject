spring:
  application:
    name: novacasino-api

  messages:
    basename: i18n/messages
    encoding: UTF-8
    use-code-as-default-message: false  # falla ruidosamente si falta una clave

  mvc:
    problem-details:
      enabled: true  # RFC 9457 ProblemDetail para excepciones Spring MVC estándar

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/novacasino}
    username: ${SPRING_DATASOURCE_USERNAME:novacasino}
    password: ${SPRING_DATASOURCE_PASSWORD:novacasino}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none   # Flyway gestiona el schema; no hay entidades JPA que validar todavía
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    filter:
      order: 10

server:
  port: 8080
  error:
    include-message: always

# HU-33: only "health" is exposed over HTTP (Spring Boot's own default, made explicit here) and
# without details, so the public healthcheck (deploy/docker-compose.prod.yml, scripts/smoke-test.sh)
# reveals nothing about the app beyond UP/DOWN. It is permitted without auth in SecurityConfig.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
    # Refresh token de vida larga (HU-13): 30 días por defecto.
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}

  # Juego responsable (HU-19): enfriamiento para relajar un límite (24 h por defecto).
  responsible-gaming:
    cooldown-seconds: ${RG_COOLDOWN_SECONDS:86400}

  # Simulaciones masivas (HU-37): un VPS de demo tiene CPU/memoria limitadas y cada simulación ya
  # reparte trabajo entre todos los núcleos, así que se acota tanto el número de simulaciones RUNNING
  # a la vez (rechazo de negocio, 429) como el tamaño del executor asíncrono que las ejecuta.
  simulation:
    max-concurrent: ${SIMULATION_MAX_CONCURRENT:3}
    executor:
      core-pool-size: ${SIMULATION_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${SIMULATION_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${SIMULATION_EXECUTOR_QUEUE_CAPACITY:10}

  # Rate limiting anti-bot/anti-abuso (token bucket en memoria, single-node). Se aplica a
  # POST /api/v1/auth/login (clave por IP) y POST /api/v1/player/games/{id}/spin (clave por
  # usuario autenticado, o IP si no lo está). Al agotarse el cupo se responde 429 (RFC 9457).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      refill-period-seconds: ${RATE_LIMIT_LOGIN_REFILL_SECONDS:60}
    spin:
      capacity: ${RATE_LIMIT_SPIN_CAPACITY:60}
      refill-period-seconds: ${RATE_LIMIT_SPIN_REFILL_SECONDS:60}

# Seed account passwords (HU-38): kept as real accounts even on a public demo (so an evaluator can
# log in without requesting one), but their passwords come from the environment instead of being
# fixed in the source code. Blank/unset falls back to the classic dev values (SeedDataLoader guards
# against a present-but-empty override too).
seed:
  password:
    admin: ${SEED_ADMIN_PASSWORD:admin123}
    operator: ${SEED_OPERATOR_PASSWORD:operator123}
    math: ${SEED_MATH_PASSWORD:math123}
    player: ${SEED_PLAYER_PASSWORD:player123}

# AI explainability (HU-8 / HU-32). Disabled by default: without a key the explain endpoint answers
# with a local, deterministic OfflineExplainer (heuristic summary of the metrics) instead of a 503.
# Set ANTHROPIC_ENABLED=true (and ANTHROPIC_API_KEY) to route "ask the AI" through Claude instead.
anthropic:
  enabled: ${ANTHROPIC_ENABLED:false}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.novacasino: ${LOG_LEVEL_APP:INFO}
    # Set to DEBUG to trace the high-volume happy path: per-spin/recharge detail and every access line
    # (problems — HTTP >= 400 — are already visible at INFO via WARN access logs).
    com.novacasino.api.player: ${LOG_LEVEL_PLAYER:INFO}
    http.access: ${LOG_LEVEL_ACCESS:INFO}
  structured:
    format:
      console: logstash
