name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Backend — build & test
        working-directory: backend
        run: mvn -B verify
        env:
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long

      - name: Frontend — install, test & build
        # The accessibility checks (HU-22, *.a11y.test.tsx: keyboard/roles/labels/live regions) run as
        # part of the Vitest suite, so a regression in the main views fails CI.
        working-directory: frontend
        run: |
          pnpm install
          pnpm test -- --run
          pnpm build

      - name: Publish Jacoco coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/nova-web-api/target/site/jacoco/

  # Job 'perf' (HU-2-DEV-01): 10M-spin budget + functional-regression guard.
  # Runs after build-test so a normal commit is not penalised; blocks merge on time/metric regression.
  perf:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run the perf suite (10M spins, @Tag perf)
        working-directory: backend
        run: mvn -B -pl nova-simulator -am test -Dgroups=perf -DexcludedGroups=

      - name: Publish simulation perf artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: backend/nova-simulator/target/perf/

  # El job 'e2e' (HU-1-QA-01) se añade en su ticket.
